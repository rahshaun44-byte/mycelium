# =============================================================================
# Pavilion (qflex / 100.107.2.18) -- STANDALONE Kafka deployment.
#
# This file is SELF-CONTAINED. Run it alone:
#   docker compose -f docker-compose.kafka.pavilion.yml up -d
#
# Do NOT combine it with docker-compose.kafka.yml via "-f base -f this".
# Compose APPENDS port lists on merge, so the base file's 0.0.0.0 bindings
# would be re-added alongside these, silently re-exposing the broker to the LAN.
#
# Tuned for the node's real hardware: Intel Celeron 450, 1 core, 1.9 GB RAM.
# =============================================================================

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: qf-kafka-broker
    ports:
      # Publish ONLY on the Tailscale interface. Docker bypasses INPUT-chain
      # firewalls (it DNATs and traverses FORWARD), so binding is the control
      # that actually works. 29092 is inter-broker only -- not published.
      - "100.107.2.18:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://100.107.2.18:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_HEAP_OPTS: '-Xmx512m -Xms512m'
    deploy:
      resources:
        limits:
          memory: 900M
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: qf-kafka-ui
    profiles: ["ui"]
    ports:
      - "100.107.2.18:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: quantum-flex-mesh
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: '-Xmx256m'
    deploy:
      resources:
        limits:
          memory: 400M
    depends_on:
      - kafka
