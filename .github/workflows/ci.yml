name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-immune-daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pqc-immune-daemon
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pqc-immune-daemon/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run immune daemon tests
        run: |
          pytest -v test_immune_daemon.py

  verify-mermin-bell-and-settlement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Run Mermin-Bell inequality & DIQRNG tests
        run: |
          pytest -v tests/test_mermin_bell_evaluator.py

      - name: Run empirical QPU settlement verification
        run: |
          python3 tests/test_circle_usdc_settlement.py

  test-mobile-mesh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest cryptography fastapi httpx pydantic

      - name: Run mobile mesh & distribution tests
        run: |
          pytest -v tests/test_mobile_distribution.py tests/test_mobile_cli.py tests/test_mobile_ota_routes.py
