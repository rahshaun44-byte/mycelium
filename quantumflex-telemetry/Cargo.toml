[package]
name = "quantumflex-telemetry"
version = "0.1.0"
edition = "2021"
description = "PCR 10 IMA replay and Gatekeeper OPA input for QuantumFlex"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bytes = "1"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.7", features = ["json", "tokio"] }
tokio = { version = "1.38", features = ["full"] }
