<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QuantumFlex Mobile Node</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span class="brand-title">QUANTUMFLEX</span>
      </div>
      <div class="status-indicator">
        <span class="badge" style="background:var(--accent-cyan); color:#000; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:bold;">SECURE MESH</span>
      </div>
    </header>

    <main class="tab-view active" id="tab-chat">
      <div class="chat-feed" id="chatFeed">
        <div class="msg-wrapper bot">
          <div class="msg-avatar">⬡</div>
          <div class="msg-body">
            <div class="msg-meta">
              <span class="msg-sender">A.M.A.R.A.</span>
              <span class="msg-callsign">@amara</span>
              <span class="msg-time">Just now</span>
            </div>
            <div class="msg-content">
              <p><strong>Chief Architect on deck.</strong> Swarm is operational on the primary node.</p>
              <div class="quick-prompts-grid">
                <button class="prompt-chip" onclick="sendPrompt('SITREP')">📋 Request SITREP</button>
                <button class="prompt-chip" onclick="sendPrompt('@sentinel verify TPM')">▲ Verify TPM 2.0</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <footer class="chat-input-dock">
        <div class="bot-selector-wrap">
          <select id="targetBotSelect">
            <option value="">⬡ Swarm Coordination (All Units)</option>
            <option value="amara">⬡ A.M.A.R.A. (Operations)</option>
            <option value="sentinel">▲ SENTINEL (Defense)</option>
            <option value="immune">☤ IMMUNE (PQC Agility)</option>
            <option value="claw">⚙ THE CLAW (Substrate)</option>
          </select>
        </div>
        <form id="chatForm" class="chat-form">
          <textarea id="chatInput" rows="1" placeholder="Tactical directive..."></textarea>
          <button type="submit" class="btn-send" id="btnSend">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
      </footer>
    </main>

    <section class="tab-view" id="tab-telemetry">
      <h3 style="margin-bottom: 1rem; color:var(--text-secondary); font-size:0.8rem; letter-spacing:1px;">NODE TELEMETRY</h3>
      <div class="vitals-grid">
        <div class="vital-card">
          <div class="vital-label">HOMEOSTATIC DRIVE</div>
          <div class="vital-value-big">447.1</div>
          <div class="vital-status green">OPTIMAL</div>
        </div>
        <div class="vital-card">
          <div class="vital-label">HARDWARE TRUST</div>
          <div class="vital-value-big">0x1c00010</div>
          <div class="vital-status green">TPM MATCHED</div>
        </div>
        <div class="vital-card">
          <div class="vital-label">PQC ALGORITHM</div>
          <div class="vital-value-big">ML-KEM-768</div>
          <div class="vital-status blue">FIPS 203 COMPLIANT</div>
        </div>
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('tab-chat', this)">
        <span class="icon">💬</span>
        <span>Tactical</span>
      </button>
      <button class="nav-btn" onclick="switchTab('tab-telemetry', this)">
        <span class="icon">📊</span>
        <span>Telemetry</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
