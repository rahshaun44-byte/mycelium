# ==============================================================================
# QuantumFlex: High-Throughput Broadband & Tailscale Overlay Sysctl Tuning
# Target: Astound Broadband + Tailscale WireGuard Mesh
# Platform: Lenovo Yoga 7 2-in-1 14AKP10 (AMD Ryzen AI 5 340, Linux 7.0)
# ==============================================================================

# 1. Packet Forwarding for Tailscale Subnet Router & Mesh Routing
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# 2. Queue Discipline & TCP Congestion Control (Google BBR)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 3. WireGuard & Tailscale UDP Buffer Optimization (16MB maximum buffers)
# Prevents socket buffer drops during high-speed multi-megabyte burst transfers
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 65536
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# 4. TCP Window Scaling & High-Speed Broadband Tuning
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1

# 5. Network Core Backlog & Socket Table Resilience
net.core.netdev_max_backlog = 10000
net.core.somaxconn = 4096

# 6. Attack Surface Reduction (CVE-2026-98432 Multipath TCP Race Mitigation)
net.mptcp.enabled = 0

